name: G0 NASM lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install NASM and GNU binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm binutils

      - name: Verify environment
        run: bash environment/verify.sh

      - name: Build all G0 programs
        run: bash scripts/build-g0.sh

      - name: Run G0 regression suite
        run: bash scripts/test-g0.sh
